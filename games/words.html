'use strict';
const dictionary=JSON.parse(document.getElementById('word-data').textContent);
const keys=Object.keys(dictionary),storageKey='waiting-words-v1';
const $=id=>document.getElementById(id);
const allWords=new Set(Object.values(dictionary).flat());
let selected=new Set(keys),used=new Set(),count=1;
try{
 const saved=JSON.parse(localStorage.getItem(storageKey)||'null');
 if(saved&&Array.isArray(saved.selected)&&Array.isArray(saved.used)){
  selected=new Set(saved.selected.filter(x=>keys.includes(x)));
  used=new Set(saved.used.filter(x=>allWords.has(x)));
  if(Number.isInteger(saved.count)&&saved.count>=1&&saved.count<=5)count=saved.count;
 }
}catch(e){}
$('count').value=String(count);
function save(){try{localStorage.setItem(storageKey,JSON.stringify({selected:[...selected],used:[...used],count}));}catch(e){}}
function pool(){const seen=new Set();return keys.filter(k=>selected.has(k)).flatMap(k=>dictionary[k].map(word=>({cat:k,word}))).filter(x=>{if(seen.has(x.word))return false;seen.add(x.word);return true;});}
function remainingPool(){return pool().filter(x=>!used.has(x.word));}
function refresh(){
 const p=pool(),remaining=remainingPool();
 $('remaining').textContent=`未出題 ${remaining.length} / ${p.length} 語`;
 $('selected').textContent=`${selected.size} / ${keys.length} カテゴリ`;
 $('draw').disabled=remaining.length<count;
 $('notice').textContent=!selected.size?'カテゴリを1つ以上選んでください':remaining.length<count?`未出題が${count}語未満です。出題数を減らすか、カテゴリ・履歴を変更してください。`:'';
}
function showWords(items){
 const list=$('word-list');list.replaceChildren();
 for(const x of items){
  const card=document.createElement('div'),cat=document.createElement('div'),word=document.createElement('div');
  card.className='word-item';cat.className='category';word.className='word';
  cat.textContent=x.cat;word.textContent=x.word;card.append(cat,word);list.append(card);
 }
}
function draw(){
 const options=remainingPool();if(options.length<count)return;
 // Partial Fisher-Yates shuffle: sample without replacement.
 for(let i=0;i<count;i++){const j=i+Math.floor(Math.random()*(options.length-i));[options[i],options[j]]=[options[j],options[i]];}
 const items=options.slice(0,count);for(const x of items)used.add(x.word);
 showWords(items);save();refresh();
}
for(const k of keys){
 const label=document.createElement('label'),input=document.createElement('input'),span=document.createElement('span');
 input.type='checkbox';input.checked=selected.has(k);
 input.addEventListener('change',()=>{if(input.checked)selected.add(k);else selected.delete(k);save();refresh();});
 span.textContent=k;label.append(input,span);$('checks').append(label);
}
function sync(){document.querySelectorAll('#checks input').forEach((el,i)=>el.checked=selected.has(keys[i]));save();refresh();}
$('count').addEventListener('change',()=>{count=Number($('count').value);save();refresh();});
$('draw').onclick=draw;
$('all').onclick=()=>{selected=new Set(keys);sync();};
$('none').onclick=()=>{selected.clear();sync();};
$('reset').onclick=()=>{if(confirm('出題履歴をリセットしますか？')){used.clear();$('word-list').innerHTML='<div class="placeholder">？</div>';save();refresh();}};
refresh();
</script><script data-wg-home-confirm>
(function(){
  let pending=null;
  window.wgConfirmHome=function(message){
    if(pending)return pending;
    const previous=document.activeElement;
    const dialog=document.createElement('dialog');
    dialog.setAttribute('aria-label','サイトTOPへ戻る確認');
    dialog.style.cssText='border:1px solid #cfc8ba;border-radius:18px;padding:22px;width:min(90vw,380px);max-height:85dvh;overflow:auto;background:#fffaf1;color:#202522;box-shadow:0 16px 60px #0005;font:16px/1.6 system-ui,sans-serif;text-align:center;';
    const text=document.createElement('p');text.textContent=message||'サイトTOPへ戻りますか？';text.style.cssText='margin:0 0 18px;font-weight:700;white-space:pre-wrap;';
    const actions=document.createElement('div');actions.style.cssText='display:flex;gap:12px;';
    const no=document.createElement('button'),yes=document.createElement('button');
    for(const button of [no,yes]){button.type='button';button.style.cssText='flex:1;min-height:48px;border:1px solid #958b76;border-radius:12px;padding:10px;background:#fffaf1;color:#202522;font:700 16px system-ui,sans-serif;cursor:pointer;';}
    no.textContent='NO';yes.textContent='YES';yes.style.background='#202522';yes.style.color='#fffaf1';
    actions.append(no,yes);dialog.append(text,actions);document.body.append(dialog);
    pending=new Promise(resolve=>{
      function finish(result){dialog.close();dialog.remove();pending=null;previous?.focus?.();resolve(result);}
      no.onclick=()=>finish(false);yes.onclick=()=>finish(true);
      dialog.addEventListener('cancel',event=>{event.preventDefault();finish(false)});
      dialog.addEventListener('click',event=>{if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)finish(false)}});
    });
    dialog.showModal();no.focus();return pending;
  };
  const approved=new WeakSet();
  document.addEventListener('click',event=>{
    const link=event.target.closest?.('a.wg-home');if(!link)return;
    if(approved.has(link))return;
    event.preventDefault();event.stopImmediatePropagation();
    if(pending)return;
    window.wgConfirmHome().then(yes=>{if(!yes)return;approved.add(link);try{link.click()}finally{approved.delete(link)}});
  },true);
})();
</script>
<script data-wg-display>
(function(){
 'use strict';
 const KEY='waitingGamesDisplayV1';
 function normalize(value){const v=value&&typeof value==='object'?value:{};const n=Number(v.percent);return{mode:v.mode==='manual'?'manual':'auto',percent:Number.isFinite(n)?Math.min(175,Math.max(75,Math.round(n/5)*5)):100};}
 function autoFactor(width,shortSide){const edge=Math.min(width,shortSide>0?shortSide:width);return edge<600?1:edge<900?1.25:1.5;}
 function scaleCSS(css,factor){
  return css.replace(/@media[^{}]+\{/g,query=>query.replace(/((?:min-|max-)?(?:width|height)\s*:\s*)([\d.]+)px/g,(_,prefix,n)=>prefix+(Number(n)*factor)+'px'))
   .replace(/(-?\d*\.?\d+)(dvh|svh|lvh|vmin|vmax|vh|vw)\b/g,(_,n,unit)=>'calc('+n+' * var(--wg-'+unit+'))');
 }
 // Browser integration
 function load(){try{return normalize(JSON.parse(localStorage.getItem(KEY)||'null'))}catch(e){return normalize(null)}}
 let setting=load(),factor=1,saved=true;
 const root=document.documentElement,draw=location.pathname.endsWith('/draw.html');

 let optionButton=null,optionsDialog=null;
 if(location.pathname.includes('/games/')){
  const uiStyle=document.createElement('style');uiStyle.textContent=`
  #wgGameOptionsButton{position:fixed;right:10px;top:max(10px,env(safe-area-inset-top));z-index:140;width:auto;min-height:30px;margin:0;border:1px solid #958b76;border-radius:999px;padding:8px 10px;background:#fffaf1;color:#202522;font:800 11px/1 system-ui,sans-serif;cursor:pointer}
  #wgGameOptions{width:min(94%,420px);box-sizing:border-box;border:1px solid #958b76;border-radius:18px;padding:18px;background:#fffaf1;color:#202522;font:14px/1.6 system-ui,sans-serif;max-height:88dvh;overflow:auto;text-align:left}
  #wgGameOptions::backdrop{background:#0008}#wgGameOptions h2{margin:0 0 14px;font:800 20px system-ui,sans-serif;color:#202522}#wgGameOptions h3{margin:0;font:800 15px system-ui,sans-serif;color:#202522}
  #wgGameOptions .display-head{display:flex;justify-content:space-between;align-items:center;gap:10px}#wgGameOptions select,#wgGameOptions button{box-sizing:border-box;border:1px solid #cfc8ba;border-radius:10px;padding:10px;background:#fff;color:#202522;font:700 13px system-ui,sans-serif;min-height:42px;margin:0;width:auto}
  #wgGameOptions .display-range{display:flex;align-items:center;gap:8px;margin:14px 0}#wgGameOptions .display-range input{min-width:0;flex:1;width:100%;height:auto;padding:0}#wgGameOptions output{min-width:42px;font-size:13px;font-weight:800;text-align:right}#wgGameOptions .display-range button{min-width:36px;padding:8px}#wgGameOptions button:disabled{opacity:.4}#wgGameOptions p{font-size:12px;color:#59625c;line-height:1.6;margin:12px 0}#wgGameOptions #wgGameOptionsClose{width:100%;margin-top:8px;background:#202522;color:#fffaf1}
  `;document.head.append(uiStyle);
  optionButton=document.createElement('button');optionButton.id='wgGameOptionsButton';optionButton.type='button';optionButton.textContent='オプション';optionButton.setAttribute('aria-controls','wgGameOptions');optionButton.setAttribute('aria-expanded','false');optionButton.setAttribute('aria-haspopup','dialog');
  optionsDialog=document.createElement('dialog');optionsDialog.id='wgGameOptions';optionsDialog.setAttribute('aria-label','ゲーム内オプション');optionsDialog.innerHTML=`<h2>オプション</h2><div class="display-head"><h3>表示サイズ</h3><select id="displayMode" aria-label="表示サイズの決め方"><option value="auto">自動</option><option value="manual">手動</option></select></div><div class="display-range"><button id="displaySmaller" type="button" aria-label="表示を小さくする">−</button><input id="displayScale" type="range" min="75" max="175" step="5" value="100" aria-label="表示倍率"><button id="displayLarger" type="button" aria-label="表示を大きくする">＋</button><output id="displayScaleValue" for="displayScale">100%</output></div><button id="displayReset" type="button">標準（100%）に戻す</button><p id="displayStatus" role="status"></p><button id="wgGameOptionsClose" type="button">閉じる</button>`;
  document.body.append(optionButton,optionsDialog);
  optionButton.onclick=()=>{sync();optionsDialog.showModal();optionButton.setAttribute('aria-expanded','true');window.dispatchEvent(new CustomEvent('wgoptionschange',{detail:{open:true}}));};
  optionsDialog.querySelector('#wgGameOptionsClose').onclick=()=>optionsDialog.close();optionsDialog.addEventListener('close',()=>{optionButton.setAttribute('aria-expanded','false');optionButton.focus();window.dispatchEvent(new CustomEvent('wgoptionschange',{detail:{open:false}}));});optionsDialog.addEventListener('keydown',e=>e.stopPropagation());
  optionsDialog.addEventListener('click',e=>{if(e.target===optionsDialog){const r=optionsDialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)optionsDialog.close()}});
 }
 const originals=new Map([...document.querySelectorAll('style')].map(style=>[style,style.textContent]));
 const extra=document.createElement('style');extra.id='wg-display-layout';document.head.append(extra);
 function apply(){
  factor=setting.mode==='manual'?setting.percent/100:autoFactor(window.innerWidth,Math.min(window.screen.width,window.screen.height));
  const layout=draw?1:factor;
  root.style.zoom=String(layout);root.dataset.wgDisplay=setting.mode;root.dataset.wgDisplayScale=String(factor);
  for(const unit of ['vh','dvh','svh','lvh','vw','vmin','vmax'])root.style.setProperty('--wg-'+unit,'calc(1'+unit+' / '+layout+')');
  for(const [style,css]of originals)style.textContent=scaleCSS(css,layout);
  extra.textContent='html{height:calc(100 * var(--wg-dvh));overflow:auto}body{min-height:calc(100 * var(--wg-dvh))}dialog{max-width:calc(100% - 24px)!important;max-height:calc(88 * var(--wg-dvh))!important}'+
   (draw?'header,#toolRow,#footer,.drawer,dialog,#wgGameOptionsButton{zoom:'+factor+'}.drawer{height:calc(100dvh / '+factor+');bottom:auto}dialog{max-width:calc((100vw - 24px) / '+factor+')!important;max-height:calc(85dvh / '+factor+')!important}':
   '@media(max-width:'+(360*layout)+'px){.brand{flex-wrap:wrap}.quick,.player-inputs{grid-template-columns:1fr}.controlDeck{grid-template-columns:1fr}.pad{grid-template-columns:repeat(3,minmax(0,1fr))}}');
  sync();window.dispatchEvent(new CustomEvent('wgdisplaychange',{detail:{factor}}));
 }
 function sync(){
  const mode=document.getElementById('displayMode'),range=document.getElementById('displayScale'),value=document.getElementById('displayScaleValue'),status=document.getElementById('displayStatus');if(!mode)return;
  mode.value=setting.mode;range.value=String(setting.mode==='manual'?setting.percent:Math.round(factor*100));range.disabled=setting.mode!=='manual';value.textContent=Math.round(factor*100)+'%';
  for(const id of ['displaySmaller','displayLarger'])document.getElementById(id).disabled=setting.mode!=='manual'||(id==='displaySmaller'?setting.percent<=75:setting.percent>=175);
  status.textContent=(setting.mode==='auto'?'画面に合わせて自動調整':'手動でサイズを指定')+'。TOPと全ゲームに反映します。'+(saved?'':'このブラウザでは保存できないため、現在の画面だけに反映します。');
 }
 function set(value){setting=normalize(value);try{localStorage.setItem(KEY,JSON.stringify(setting));saved=true}catch(e){saved=false}apply();}
 window.WGDisplay={get setting(){return{...setting}},get factor(){return factor},get optionsOpen(){return !!optionsDialog?.open},set};
 const mode=document.getElementById('displayMode');if(mode){
  mode.addEventListener('change',()=>set({mode:mode.value,percent:Math.round(factor*100)}));
  document.getElementById('displayScale').addEventListener('input',e=>set({mode:'manual',percent:e.target.value}));
  document.getElementById('displaySmaller').onclick=()=>set({mode:'manual',percent:setting.percent-5});document.getElementById('displayLarger').onclick=()=>set({mode:'manual',percent:setting.percent+5});
  document.getElementById('displayReset').onclick=()=>set({mode:'manual',percent:100});
 }
 let resizeFrame=0;window.addEventListener('resize',()=>{cancelAnimationFrame(resizeFrame);resizeFrame=requestAnimationFrame(apply)});
 window.addEventListener('storage',e=>{if(e.key===KEY||e.key===null){setting=load();apply()}});
 apply();
})();
</script>
