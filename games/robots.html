<div class="top"><div class="title">WAITING ROBOTS</div><div class="ver">prototype v4.7</div></div>
<div class="panel setupPanelMobile" id="setupPanel">
  <div class="status">プレイヤー人数</div><div class="sub">2〜4人 / 全3ラウンド</div>
  <div class="setup" style="margin-top:9px"><button data-n="2" class="active">2人</button><button data-n="3">3人</button><button data-n="4">4人</button></div>
  <div class="divider"></div>
  <div class="toggleRow"><div><b>カスタマイズ</b><div class="tiny">特殊能力を使用</div></div><div class="toggle"><button id="customOn" class="active">ON</button><button id="customOff">OFF</button></div></div>
  <div class="divider"></div><div class="toggleRow"><div><b>カラーロード</b><div class="tiny">歩いたマスを塗り、ラウンド順位でボーナス得点</div></div><div class="toggle"><button id="roadOn" class="active">ON</button><button id="roadOff">OFF</button></div></div>
  <div id="customSetup">
    <div class="divider"></div><div class="toggleRow"><div><b>初期能力</b><div class="tiny">全プレイヤーが同じ能力を取得</div></div><div class="toggle"><button id="modeRandom" class="active">ランダム1</button><button id="modeChoose">選択</button></div></div>

function buildBoard(){var b=$('board');b.innerHTML='';b.style.gridTemplateColumns='repeat('+gridSize+',1fr)';b.style.gridTemplateRows='repeat('+gridSize+',1fr)';for(var i=0;i<gridSize*gridSize;i++){var d=document.createElement('div'),r=Math.floor(i/gridSize),c=i%gridSize;d.className='cell'+(isWall(r,c)?' wall':'');d.id='cell'+i;b.appendChild(d)}renderBoard()}

function showRoundRanking(){var rows=rankingRows();$('status').textContent='ROUND '+round+' COMPLETE';$('sub').textContent='現在の累計ランキング';var html='<h2>ROUND '+round+' RESULT</h2>';if(colorRoad){html+='<div class="colorRoadResult"><b>🎨 COLOR ROAD</b>';for(var i=0;i<rows.length;i++){var cr=rows[i];html+='<div class="roadResultRow"><span>'+playerName(cr.idx)+'</span><span>'+cr.roadCount+'マス</span><span class="roadBonus">+'+cr.roadBonus+'点</span></div>'}html+='</div>'}html+='<div class="roundRank">';for(i=0;i<rows.length;i++){var r=rows[i];html+='<div class="rankRow'+(r.rank===1?' lead':'')+'"><div class="rankNum">'+r.rank+'位</div><div class="rankPlayer">'+playerName(r.idx)+'</div><div class="rankRound">今回 '+(r.gain>=0?'+':'')+r.gain+'点</div><div class="rankTotal">'+r.total+'点</div></div>'}var isFinal=round>=maxRounds;html+='</div><div class="roundResultHint">'+(isFinal?'OKを押すと最終結果へ進みます。':'OKを押すと'+(custom?'アビリティ獲得':'次のラウンド')+'へ進みます。')+'</div><button class="primary" id="roundOk">OK</button>';$('result').innerHTML=html;$('result').classList.remove('hidden');renderScores();$('roundOk').onclick=function(){$('result').classList.add('hidden');if(isFinal){endGame()}else if(custom)startDraft();else{round++;setupRound()}}}
function showNextRound(){round++;setupRound()}
function startDraft(){draftOrder=[].concat(players.map(function(p,i){return i})).sort(function(a,b){var d=players[a].score-players[b].score;return d||((Math.random()<.5)?-1:1)});draftPos=0;var pool=AB.filter(function(a){return !(a.unique&&players.some(function(p){return has(p,a.id)}))});draftOptions=shuffle(pool).slice(0,Math.min(N+1,pool.length));if(!draftOptions.length){round++;setupRound();return}$('draftOverlay').className='overlay show';renderDraft()}
function renderDraft(){var who=draftOrder[draftPos],p=players[who];$('draftText').textContent='累計得点が低い順に選択　→　'+playerName(who)+' の番';var g=$('draftGrid');g.innerHTML='';var usable=0;draftOptions.forEach(function(a){var b=document.createElement('button');b.className='draftCard';var actionFull=a.action&&actionAbs(p).length>=3;var alreadyOwn=has(p,a.id);var uniqueTaken=a.unique&&players.some(function(x,idx){return idx!==who&&has(x,a.id)});var disabled=actionFull||alreadyOwn||uniqueTaken;b.disabled=disabled;if(!disabled)usable++;var reason=actionFull?'（アクション枠満杯）':alreadyOwn?'（取得済み）':uniqueTaken?'（他プレイヤー所持中）':'';b.innerHTML='<b>'+a.n+'</b><span>'+a.rule+' / '+a.desc+reason+'</span>';b.onclick=function(){p.abilities.push(a.id);draftOptions=draftOptions.filter(function(x){return x.id!==a.id});draftPos++;if(draftPos>=N){$('draftOverlay').className='overlay';round++;setupRound()}else renderDraft()};g.appendChild(b)});if(!usable){var skip=document.createElement('button');skip.className='draftCard';skip.innerHTML='<b>今回はスキップ</b><span>取得できる能力候補がないため次へ進みます。</span>';skip.onclick=function(){draftPos++;if(draftPos>=N){$('draftOverlay').className='overlay';round++;setupRound()}else renderDraft()};g.appendChild(skip)}}
function endGame(){
 phase='result';
 $('status').textContent='FINAL RESULT';

 $('inputPanel').classList.add('hidden');$('runPanel').classList.add('hidden');
 var boardPanel=$('board').parentElement&&$('board').parentElement.parentElement;$('board').innerHTML='';if(boardPanel)boardPanel.classList.add('hidden');
 var max=-999,w=[];for(var i=0;i<N;i++){if(players[i].score>max){max=players[i].score;w=[i]}else if(players[i].score===max)w.push(i)}
 var names=w.map(function(i){return playerName(i)});
 var order=players.map(function(p,i){return{idx:i,score:p.score}}).sort(function(a,b){return b.score-a.score||a.idx-b.idx});
 var high=1;for(i=0;i<N;i++)for(var rr=0;rr<maxRounds;rr++)high=Math.max(high,Math.max(0,players[i].roundHistory[rr]||0));
 var html='<h2>★ '+max+'点</h2><div class="winner">'+(w.length===1?names[0]+' WIN!':names.join(' & ')+' DRAW')+'</div>';
 html+='<div class="finalSummary"><div class="finalCard"><h3>ラウンド別スコア取得</h3><div class="finalLegend">';
 for(i=0;i<N;i++)html+='<span class="legendItem"><i class="legendDot ld'+i+'"></i>'+playerName(i)+'</span>';
 html+='</div><div class="barChart">';
 for(rr=0;rr<maxRounds;rr++){html+='<div class="barRound"><div class="barLabel">R'+(rr+1)+'</div><div class="barGroup">';for(i=0;i<N;i++){var val=players[i].roundHistory[rr]||0;var h=Math.max(3,Math.round(Math.max(0,val)/high*78));html+='<div class="barCol"><div class="barValue">'+val+'</div><div class="bar p'+i+'" style="height:'+h+'px"></div></div>'}html+='</div></div>'}
 html+='</div></div><div class="finalCard"><h3>試合スタッツ</h3><div class="metricGrid">';
 for(i=0;i<N;i++){var pp=players[i],roadTotal=(pp.roadHistory||[]).reduce(function(a,b){return a+(b||0)},0),treasurePts=pp.treasurePoints||0,roadPts=pp.colorRoadPoints||0,abilityHits=pp.abilityHits||0,otherPts=pp.score-treasurePts-roadPts;html+='<div class="metricRow"><b>'+playerName(i)+'</b><div class="metricVal">'+(pp.contacts||0)+'<span style="font-size:11px"> 回</span></div><div class="metricSub">接触回数</div><div class="metricVal" style="margin-top:7px">'+(colorRoad?roadTotal:'-')+(colorRoad?'<span style="font-size:11px"> マス</span>':'')+'</div><div class="metricSub">マップ色塗り数'+(colorRoad?'（3R合計）':'（COLOR ROAD OFF）')+'</div><div style="margin-top:7px"><span class="hitBadge">⚡ 能力命中 '+abilityHits+'回</span></div><div class="breakdown"><div class="breakRow"><span>💎 宝取得点</span><span>'+treasurePts+'点</span></div><div class="breakRow"><span>🎨 COLOR ROAD点</span><span>'+(colorRoad?roadPts+'点':'-')+'</span></div><div class="breakRow"><span>⚙ その他増減</span><span>'+(otherPts>=0?'+':'')+otherPts+'点</span></div></div></div>'}
 html+='</div></div><div class="finalCard"><h3>最終順位</h3><div class="finalTotals">';
 var last=null,rank=0;for(i=0;i<order.length;i++){if(last===null||order[i].score!==last){rank=i+1;last=order[i].score}html+='<div class="finalTotalRow"><span class="place">'+rank+'位　'+playerName(order[i].idx)+'</span><span>接触 '+(players[order[i].idx].contacts||0)+'</span><span class="points">'+order[i].score+'点</span></div>'}
 html+='</div></div></div><button class="primary" id="restartBtn" style="margin-top:12px;width:100%">もう一度</button>';
 $('result').innerHTML=html;$('result').classList.remove('hidden');renderScores();$('restartBtn').onclick=function(){location.reload()}
}
function chooseInitialAbilities(){if(!custom)return[];if(initialMode==='choose')return selectedInitial.slice();var pool=AB.filter(function(a){return a.initial!==false});return[pool[Math.floor(Math.random()*pool.length)].id]}

})();
