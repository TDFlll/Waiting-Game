<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;min-height:100%;overscroll-behavior:none}button{font:inherit;color:inherit}.app{min-height:100dvh;display:flex;flex-direction:column;padding:max(8px,env(safe-area-inset-top)) 8px max(10px,env(safe-area-inset-bottom));gap:7px;max-width:620px;margin:auto}.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}.brand{text-align:center;font-weight:900;letter-spacing:.08em;font-size:clamp(12px,3.3vw,15px)}.brand small{display:block;font-size:9px;color:var(--muted);letter-spacing:.15em}.score{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:6px 8px;box-shadow:var(--shadow);font-size:11px;line-height:1.25}.score.p2{text-align:right}.score b{font-size:18px}.p1c{color:var(--p1)}.p2c{color:var(--p2)}.status{background:#272720;color:#f6f0e3;border-radius:11px;padding:7px 10px;display:flex;justify-content:space-between;align-items:center;font-size:11px;gap:6px}.status strong{font-size:13px}.board{display:grid;grid-template-rows:auto auto auto;gap:5px}.sideLabel{text-align:center;font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--muted)}.field{display:grid;grid-template-columns:1fr 1fr;gap:6px}.lane{display:grid;grid-template-rows:auto auto;gap:4px;background:#e8dfcd;border:1px solid var(--line);border-radius:12px;padding:5px}.slot{position:relative;min-height:clamp(70px,18vw,98px);border:1.5px dashed #a69a83;border-radius:9px;background:#f9f3e6;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;overflow:hidden}.slot.magic{min-height:clamp(45px,11vw,60px)}.slot.empty::after{content:attr(data-empty);color:#aaa18f;font-size:9px}.card{width:100%;height:100%;min-height:inherit;border:1px solid #8e856f;border-radius:8px;background:#fffdf7;padding:5px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 2px 6px #2a241a14;text-align:left}.card.monster{border-top:4px solid var(--gold)}.card.magiccard{border-top:4px solid #586b87}.card.trap{background:repeating-linear-gradient(135deg,#363630 0 8px,#44443c 8px 16px);color:#fff;border-color:#23231f;justify-content:center;align-items:center;text-align:center}.card .name{font-weight:900;font-size:clamp(9px,2.8vw,12px);line-height:1.1}.card .meta{font-size:9px;color:var(--muted)}.card.trap .meta{color:#ddd}.atk{position:absolute;right:5px;bottom:4px;background:#292823;color:#fff;padding:2px 5px;border-radius:99px;font-size:10px;font-weight:900}.sick{position:absolute;left:4px;bottom:4px;background:#d7c8a7;color:#55482f;padding:2px 4px;border-radius:99px;font-size:8px;font-weight:800}.activeOutline{outline:3px solid #d59b32;outline-offset:1px}.midline{height:1px;background:var(--line);position:relative;margin:1px 14px}.midline::after{content:"BATTLE LINE";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--bg);padding:0 7px;font-size:8px;color:var(--muted);letter-spacing:.12em}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.btn{border:1px solid #958b76;background:var(--paper);border-radius:10px;padding:9px 6px;font-weight:800;font-size:11px;box-shadow:0 2px 5px #2a241a0d}.btn.primary{background:#282821;color:white;border-color:#282821}.btn.time{background:#5b5476;color:#fff;border-color:#4a4462}.btn:disabled{opacity:.35}.handWrap{background:#e9e0cf;border-radius:13px;padding:6px;border:1px solid var(--line)}.handHead{display:flex;justify-content:space-between;align-items:center;font-size:10px;font-weight:800;margin:0 2px 5px}.hand{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:2px}.handCard{flex:0 0 min(42vw,180px);min-height:104px;background:#fffaf0;border:1px solid #948a74;border-radius:10px;padding:7px;scroll-snap-align:start;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:3px}.handCard.monster{border-top:5px solid var(--gold)}.handCard.magiccard{border-top:5px solid #586b87}.handCard .name{font-weight:900;font-size:12px}.handCard .type{font-size:9px;color:var(--muted)}.handCard .effect{font-size:9px;line-height:1.3;flex:1}.handCard .play{border:0;border-radius:8px;background:#292823;color:#fff;padding:6px;font-size:10px;font-weight:900}.foot{display:flex;gap:6px}.foot .btn{flex:1;padding:7px}.log{background:#fff8eb;border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:9px;color:#5d594f;max-height:54px;overflow:auto}.overlay{position:fixed;inset:0;background:#1e1e1bdc;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}.overlay.hidden{display:none}.handoff{background:var(--paper);border-radius:18px;padding:24px 18px;width:min(92vw,420px);text-align:center;box-shadow:0 20px 50px #0006}.handoff h2{margin:0 0 8px;font-size:26px}.handoff p{font-size:12px;color:var(--muted);line-height:1.6}.bigReady{width:100%;border:0;background:#292823;color:#fff;border-radius:12px;padding:14px;font-weight:900;margin-top:10px}.modal{background:var(--paper);border-radius:17px;padding:16px;width:min(94vw,460px);max-height:82dvh;overflow:auto}.modal h3{margin:0 0 10px}.options{display:grid;gap:7px}.opt{border:1px solid var(--line);background:#fffdf7;border-radius:10px;padding:10px;text-align:left;font-size:12px}.opt small{display:block;color:var(--muted);margin-top:3px}.cancel{margin-top:10px;width:100%;border:0;background:#ddd4c4;border-radius:9px;padding:9px}.gameover h2{font-size:28px}.tag{display:inline-block;padding:2px 5px;border-radius:5px;background:#e2d8c5;font-size:8px;font-weight:800;margin-right:3px}.tiny{font-size:8px;color:var(--muted)}

.pickable{outline:3px solid #d59b32!important;outline-offset:1px;animation:pickPulse .9s ease-in-out infinite alternate;cursor:pointer}.pickHint{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:70;background:#292823;color:#fff;padding:10px 14px;border-radius:999px;font-size:11px;font-weight:900;box-shadow:0 8px 24px #0004;max-width:90vw;text-align:center}.pickHint.hidden{display:none}@keyframes pickPulse{to{box-shadow:0 0 0 6px #d59b3230}}
.eventToast{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.94);z-index:65;background:#292823ee;color:#fff;border:1px solid #ffffff22;border-radius:14px;padding:12px 16px;max-width:min(88vw,420px);text-align:center;font-size:12px;font-weight:900;box-shadow:0 12px 35px #0005;opacity:0;pointer-events:none;transition:.18s}.eventToast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.detailCard{background:#fffdf7;border:1px solid var(--line);border-radius:12px;padding:12px}.detailCard h4{margin:0 0 5px;font-size:17px}.detailCard .detailType{font-size:10px;color:var(--muted);margin-bottom:9px}.detailCard .detailEffect{font-size:12px;line-height:1.6}.slot.inspectable{cursor:pointer}.slot.inspectable:active{transform:scale(.985)}
.digest{background:var(--paper);border-radius:18px;padding:20px 16px;width:min(92vw,430px);text-align:center;box-shadow:0 20px 50px #0006}.digest h2{margin:0 0 5px;font-size:22px}.digestList{margin-top:12px;display:grid;gap:7px;text-align:left}.digestItem{background:#eee4d2;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:11px;font-weight:800;opacity:0;transform:translateY(8px);animation:digestIn .3s ease forwards}.digestItem.current{background:#fffaf0;box-shadow:0 4px 12px #0001}@keyframes digestIn{to{opacity:1;transform:none}}


.turnDigestBar{display:none;background:#efe4d0;border:1px solid var(--line);border-radius:11px;padding:6px 7px;box-shadow:var(--shadow)}.turnDigestBar.show{display:block}.turnDigestHead{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:5px;font-size:8px;font-weight:950;letter-spacing:.12em;color:var(--muted)}.turnDigestList{display:flex;gap:5px;overflow-x:auto;padding-bottom:1px;scroll-snap-type:x proximity}.turnDigestChip{flex:0 0 auto;max-width:min(72vw,320px);background:#fffaf0;border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:9px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;scroll-snap-align:start}.turnDigestChip.effect{border-color:#8b6caa;background:#f4eef9}.effectFlash{position:fixed;left:50%;top:39%;transform:translate(-50%,-50%) scale(.88);z-index:68;width:min(86vw,390px);padding:13px 16px;border-radius:16px;background:#25231fee;color:#fff;text-align:center;box-shadow:0 18px 45px #0006;opacity:0;pointer-events:none;transition:opacity .16s ease,transform .2s ease}.effectFlash.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.effectFlash::before{content:"✦ CARD EFFECT ✦";display:block;font-size:8px;letter-spacing:.18em;color:#e8d6ff;margin-bottom:5px}.effectFlash .effectName{font-size:13px;font-weight:950;line-height:1.35}.effectFlash.show::after{content:"";position:absolute;inset:-8px;border:2px solid #ffffff55;border-radius:22px;animation:effectRing .72s ease-out forwards}@keyframes effectRing{from{opacity:.9;transform:scale(.9)}to{opacity:0;transform:scale(1.08)}}
.cpuBadge{display:inline-block;margin-left:4px;padding:1px 5px;border-radius:999px;background:#2d2c27;color:#fff;font-size:8px;font-weight:900;letter-spacing:.08em}.cpuThinking{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:64;background:#292823ee;color:#fff;border-radius:14px;padding:12px 18px;font-size:12px;font-weight:900;box-shadow:0 12px 35px #0005}.cpuThinking.hidden{display:none}
@media(max-height:700px){.slot{min-height:60px}.slot.magic{min-height:38px}.handCard{min-height:86px}.log{max-height:38px}.btn{padding:7px 4px}.app{gap:5px}}
.handWrap.privacyHidden{visibility:hidden}
.titlePanel{background:var(--paper);border-radius:20px;padding:20px 16px;width:min(94vw,460px);max-height:90dvh;overflow:auto;box-shadow:0 20px 50px #0006}.titleLogo{text-align:center;font-weight:950;letter-spacing:.12em;font-size:26px}.titleVer{text-align:center;color:var(--muted);font-size:9px;letter-spacing:.16em;margin:2px 0 14px}.titleSection{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.titleSection h3{margin:0 0 8px;font-size:12px;letter-spacing:.08em}.seg{display:grid;grid-template-columns:1fr 1fr;gap:7px}.seg button{border:1px solid var(--line);background:#fffdf7;border-radius:10px;padding:10px 8px;font-weight:900;font-size:11px}.seg button.on{background:#292823;color:#fff;border-color:#292823}.statsGrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.statBox{background:#eee4d2;border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-size:9px;color:var(--muted)}.statBox b{display:block;color:var(--ink);font-size:18px}.graveGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.graveItem{border:1px solid var(--line);background:#fffdf7;border-radius:10px;padding:8px;text-align:left}.graveItem b{display:block;font-size:11px}.graveItem small{display:block;color:var(--muted);font-size:8px;margin-top:3px}.startBtn{width:100%;border:0;background:#292823;color:#fff;border-radius:12px;padding:14px;font-weight:950;margin-top:14px}.ghostBtn{width:100%;border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px;font-size:10px;margin-top:7px}

.app{transition:background .22s ease,border-color .22s ease}

.turn-p1 .board{background:color-mix(in srgb,var(--p1) 15%,transparent);border:2px solid color-mix(in srgb,var(--p1) 60%,transparent);border-radius:15px;padding:5px}

.score.turnOwner{outline:3px solid currentColor;outline-offset:1px}
.playerName{font-size:10px;font-weight:950;letter-spacing:.08em}
.score.p1score .playerName{color:var(--p1)}
.score.p2score .playerName{color:var(--p2)}
.digestItem{opacity:1;transform:none;animation:none}

<body>
<a class="wg-home" href="../index.html" aria-label="WAITING GAMESへ戻る">← GAMES</a>
<div class="app">
  <div class="topbar">
    <div class="score p1score" id="score1"></div>
    <div class="brand">WAITING CARDS<small>PROTOTYPE v0.6.3 / V1.3</small></div>
    <div class="score p2 p2score" id="score2"></div>
  </div>
  <div class="status"><span id="turnText"></span><strong id="actionText"></strong><span id="deckText"></span></div>
  <div class="turnDigestBar" id="turnDigestBar"><div class="turnDigestHead"><span>PREVIOUS TURN</span><span id="turnDigestCount"></span></div><div class="turnDigestList" id="turnDigestList"></div></div>
  <div class="board">
    <div><div class="sideLabel" id="p2SideLabel">PLAYER 2 FIELD</div><div class="field" id="p2field"></div></div>
    <div class="midline"></div>
    <div><div class="field" id="p1field"></div><div class="sideLabel" id="p1SideLabel">PLAYER 1 FIELD</div></div>
  </div>
  <div class="controls">
    <button class="btn primary" id="attackBtn">ATTACK</button>
    <button class="btn time" id="timeBtn">TIME MAGIC</button>
    <button class="btn" id="endBtn">END TURN</button>
  </div>
  <div class="handWrap">
    <div class="handHead"><span id="handTitle">PRIVATE HAND</span><span id="graveText"></span></div>
    <div class="hand" id="hand"></div>
  </div>
  <div class="log" id="log"></div>
  <div class="foot"><button class="btn" id="rulesBtn">RULES</button><button class="btn" id="graveBtn">GRAVE</button><button class="btn" id="resetBtn">RESET</button></div>
</div>
<div class="overlay" id="titleScreen"><div class="titlePanel">
  <div class="titleLogo">WAITING CARDS</div><div class="titleVer">PROTOTYPE v0.6.3 / V1.3</div>
  <div class="titleSection"><h3>GAME MODE</h3><div class="seg"><button id="mode2p">2 PLAYER</button><button id="modeCpu">VS CPU</button></div></div>
  <div class="titleSection"><h3>先攻 1ターン目 AP</h3><div class="seg"><button id="ap1Btn">AP 1</button><button id="ap2Btn">AP 2</button></div></div>
  <div class="titleSection"><h3>先攻 1ターン目 ドロー</h3><div class="seg"><button id="drawOnBtn">ドローあり</button><button id="drawOffBtn">ドローなし</button></div></div>
  <div class="titleSection"><h3>対戦統計</h3><div class="statsGrid" id="statsGrid"></div><button class="ghostBtn" id="clearStatsBtn">統計をリセット</button></div>
  <button class="startBtn" id="startGameBtn">START GAME</button>
</div></div>
<div class="overlay hidden" id="handoff"><div class="handoff"><div class="tiny">PASS THE PHONE</div><h2 id="handoffTitle"></h2><p id="handoffMsg"></p><button class="bigReady" id="readyBtn">READY</button></div></div>
<div class="overlay hidden" id="modal"><div class="modal"><h3 id="modalTitle"></h3><div class="options" id="modalOptions"></div><button class="cancel" id="modalCancel">キャンセル</button></div></div>

<div class="pickHint hidden" id="pickHint"></div>
<div class="eventToast" id="eventToast"></div>
<div class="effectFlash" id="effectFlash"><div class="effectName" id="effectFlashText"></div></div>
<div class="cpuThinking hidden" id="cpuThinking">CPU THINKING...</div>
<div class="overlay hidden" id="digest"><div class="digest"><div class="tiny">PREVIOUS TURN</div><h2>TURN DIGEST</h2><div class="digestList" id="digestList"></div><button class="bigReady" id="digestSkip">CONTINUE</button></div></div>
<script>
'use strict';
window.addEventListener('error',function(e){try{var d=document.getElementById('bootError');if(!d){d=document.createElement('div');d.id='bootError';d.style.cssText='position:fixed;inset:12px;z-index:99999;background:#fff5f2;color:#7d1d15;border:2px solid #b54b3f;border-radius:12px;padding:14px;font:14px -apple-system,sans-serif;white-space:pre-wrap;overflow:auto';document.body.appendChild(d);}d.textContent='起動エラー\n'+(e.message||'Unknown error')+'\n'+(e.filename||'')+':'+(e.lineno||'');}catch(_){}});
const BASE_CARDS=[
{id:1,name:'激おこドラゴン',kind:'monster',atk:12,text:'攻撃がプレイヤーに到達した瞬間、ライフに関係なく特殊勝利。通常召喚できない。'},
{id:2,name:'錆びたゴーレム',kind:'monster',atk:11,text:'脱力の影響を2倍受ける。成立した戦闘が2回になると墓地へ。1回目の同士討ちでは破壊されない。'},
{id:3,name:'こどもドラゴン',kind:'monster',atk:1,text:'正面にモンスターがいてもプレイヤーへ直接攻撃可能。ATK8以上の相手との戦闘では、戦闘は成立するが戦闘では破壊されない。'},
{id:4,name:'ドリルドリ',kind:'monster',atk:7,pierce:1,text:'貫通1。踏破：戦闘で自身が墓地へ行かず相手を墓地へ送った時、貫通+1。'},
{id:5,name:'ごごご幽霊',kind:'monster',atk:3,debilitate:3,possession:true,text:'憑依。脱力3。最初に召喚したプレイヤーは憑依エンブレムを永久に得る。そのプレイヤーの罠発動成功時、墓地から任意で召喚できる。'},
{id:6,name:'デッドアイズ',kind:'monster',atk:4,text:'墓地へ送られた時、相手手札をランダム1枚墓地へ。召喚時、相手の伏せ罠1枚を確認できる。'},
{id:7,name:'反魔の死人',kind:'monster',atk:6,text:'場にいる間、罠・「書」の効果を受けず、すべての墓地発動効果を無効化。踏破：1ドロー。'},
{id:8,name:'失笑ライダー',kind:'monster',atk:8,text:'相手の伏せ罠がある列に召喚した時、突撃とAP+1を得る。'},
{id:9,name:'死霊師',kind:'monster',atk:2,text:'手札から場に出た時にチョイス：①デッキから「書」か「魔法」をランダム1枚手札へ ②墓地のごごご幽霊/反魔の死人を空き枠へ召喚。'},
{id:10,name:'デスマスク',kind:'monster',atk:4,text:'場から墓地へ送られた時、場のカードを所有者・種類を問わず1枚、必ず墓地へ送る。'},
{id:11,name:'入れかえ壺',kind:'monster',atk:9,text:'召喚時、自分の残り手札をすべてデッキへ戻してシャッフルし、戻した枚数だけドローする。'},
{id:12,name:'腐天使',kind:'monster',atk:10,faith:2,hatred:2,text:'信仰2。憎悪：このカード個体を手札から2回目以降召喚するたびATK+2。効果は重複する。'},
{id:100,name:'復活の魔法',kind:'magic',mode:'instant',magicFamily:'spell',text:'即時。墓地のモンスター1体を選び、自分の空いているモンスター枠へ召喚する。'},
{id:101,name:'反攻の儀',kind:'magic',mode:'trap',magicFamily:'rite',text:'罠。同列への相手攻撃を無効化し、攻撃側プレイヤーに1ダメージ。'},
{id:102,name:'召喚の魔法',kind:'magic',mode:'both',magicFamily:'spell',text:'罠/即時。自分の同列にモンスターがいない場合のみ発動可能。手札のモンスター1体を同列へ召喚。相手ターンに罠発動した場合、相手AP+1（最大4）。'},
{id:103,name:'偽造の書',kind:'magic',mode:'instant',isBook:true,text:'場の1行を選び、そのプレイヤーのLEFT⇔RIGHTを入れ替える。モンスター行または罠行。片側が空白なら移動する。'},
{id:104,name:'加速の儀',kind:'magic',mode:'trap',magicFamily:'rite',text:'罠。自分ターン開始時、または破壊された時に2ドロー。自分ターン中の発動ならAP+1（最大4）。'},

async function faithStartOption(p){

 if(!candidates.length)return;
 // CPUは「復活する戦力」と「捨てる手札の価値」を比較して信仰を使う。

  const handRank=S.players[p].hand.map(c=>({c,s:Math.max(0,cpuCardScore(c))})).sort((a,b)=>a.s-b.s);
  let best=null;

   const cost=c.faith||0;
   if(handRank.length<cost)continue;
   const discardValue=handRank.slice(0,cost).reduce((a,x)=>a+x.s,0);
   let summonValue=cardAtk(c)*0.65;
   if(c.id===12)summonValue+=4;
   if(c.id===7)summonValue+=3;
   if(c.id===4)summonValue+=2.5;
   if(c.id===6)summonValue+=1.5;
   if(c.id===9)summonValue+=1.2;
   const score=summonValue-discardValue*0.75+(S.players[p].monster.filter(Boolean).length===0?2:0);
   if(!best||score>best.score)best={c,score,cost};
  }
  if(!best||best.score<2.2){log('CPU：信仰は温存');return;}
  S.players[p].faithUsedTurn=S.turnNo;
  for(let n=0;n<best.cost;n++){

function placeByDescriptor(c,d){if(!d){S.grave.push(c);c.zone='grave';c.lane=null;return;}if(d.area==='hand'){S.players[d.p].hand.splice(Math.min(d.i,S.players[d.p].hand.length),0,c);c.zone=null;c.lane=null;}else if(d.area==='grave'){S.grave.splice(Math.min(d.i,S.grave.length),0,c);c.zone='grave';c.lane=null;}else if(d.area==='deck'){S.deck.splice(Math.min(d.i,S.deck.length),0,c);c.zone=null;c.lane=null;}else if(d.area==='monster'){if(!S.players[d.p].monster[d.l]){S.players[d.p].monster[d.l]=c;c.controller=d.p;c.zone='monster';c.lane=d.l;}else{S.grave.push(c);c.zone='grave';c.lane=null;}}else if(d.area==='magic'){if(!S.players[d.p].magic[d.l]){S.players[d.p].magic[d.l]=c;c.controller=d.p;c.zone='magic';c.lane=d.l;}else{S.grave.push(c);c.zone='grave';c.lane=null;}}}
function restoreState(c,s,wasSick){Object.assign(c,s);if(wasSick)c.summonedTurn=S.turnNo;else if(c.summonedTurn===S.turnNo)c.summonedTurn=S.turnNo-1;}
function rewindOwnField(p){const snap=S.players[p].snapshot;if(!snap)return false;const snapUids=new Set();for(const z of ['monster','magic'])for(let l=0;l<2;l++)if(snap.slots[z][l])snapUids.add(snap.slots[z][l].uid);const current=[];for(const z of ['monster','magic'])for(let l=0;l<2;l++){const c=S.players[p][z][l];if(c)current.push(c.uid);}const relevant=[...new Set([...current,...snapUids])],cards={};for(const id of relevant){const loc=locateCard(id);if(loc)cards[id]=removeLocated(loc);}for(const id of current){if(!snapUids.has(id)&&cards[id])placeByDescriptor(cards[id],snap.locations[id]);}for(const z of ['monster','magic'])for(let l=0;l<2;l++){const x=snap.slots[z][l];if(!x)continue;let c=cards[x.uid];if(!c){const loc=locateCard(x.uid);if(loc)c=removeLocated(loc);}if(!c)continue;restoreState(c,x.state,x.wasSick);c.controller=p;c.zone=z;c.lane=l;c.faceDown=z==='magic'?x.state.faceDown:false;S.players[p][z][l]=c;}log(`${pName(p)} の場を前回ターン終了時へ巻き戻した`);return true;}
async function useTimeMagic(){
 if(busy||S.gameover)return;
 const p=S.turn;if(S.players[p].timeUsed)return;
 const isCpu=(GAME_MODE==='CPU'&&p===CPU_PLAYER);
 const options=[];
 if(fieldCards().some(c=>c.kind==='monster'))options.push({label:'場のモンスター1体を破壊して墓地へ',sub:'AP消費なし',value:'destroy'});
 if(!isCpu&&S.actions>=1)options.push({label:'3枚ドロー → 手札1枚をデッキの底へ',sub:'AP 1消費',value:'draw'});
 if(S.actions>=2&&S.players[p].snapshot)options.push({label:'自分の場を前ターン終了時へ戻し、ターンをスキップ',sub:'AP 2消費。カード状態も巻き戻す',value:'rewind'});
 if(!options.length)return;
 const mode=await choose('TIME MAGIC / ゲーム中1回',options);
 if(!mode)return;
 busy=true;S.players[p].timeUsed=true;
 const before=S.players[p].life;
 S.players[p].life=Math.max(1,Math.floor(S.players[p].life/2));
 log(`${pName(p)} が TIME MAGIC を使用：ライフ ${before} → ${S.players[p].life}`);
 if(mode==='destroy'){
  const pick=await chooseFieldSlot('破壊する場のモンスターをタップ',(pp,ll,z,cc)=>z==='monster'&&!!cc);
  if(pick){
   const m=S.players[pick.p].monster[pick.l];
   if(m)await sendMonsterFromField(pick.p,pick.l,'time-magic-destroy');
  }
 }
 if(mode==='draw'){
  S.actions--;draw(p,3);
  if(S.players[p].hand.length){
   const id=await choose('デッキの底へ戻す手札1枚',S.players[p].hand.map(c=>({label:c.name,value:c.uid})),false);
   const i=S.players[p].hand.findIndex(c=>c.uid===id);
   if(i>=0){const c=S.players[p].hand.splice(i,1)[0];S.deck.unshift(c);log(`TIME MAGIC：${c.name} をデッキの底へ戻した`);}
  }
 }
 if(mode==='rewind'){
  S.actions-=2;rewindOwnField(p);await resolvePending();await evaluateAutoTraps();busy=false;render();await endTurn();return;
 }
 await resolvePending();await evaluateAutoTraps();busy=false;render();checkStalemate();
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
function cpuBoardValue(p){let v=S.players[p].life*4+S.players[p].hand.length*.25;for(let l=0;l<2;l++){const m=S.players[p].monster[l];if(m)v+=cardAtk(m)*.55+pierceValue(m)*1.4+(canAttack(m)?1:0);if(S.players[p].magic[l])v+=1.1;}return v;}
function cpuAttackScore(l){
 const p=CPU_PLAYER,a=S.players[p].monster[l];
 if(!a||!canAttack(a))return-99;
 const d=S.players[1-p].monster[l];
 if(!d)return a.id===1?100:8;
 if(a.id===3)return 6;
 const aa=cardAtk(a),da=cardAtk(d);
 let s=(aa-da)*.8+pierceValue(a)*2;
 if(aa>da)s+=5;else if(aa<da)s-=4;
 if(a.id===4&&aa>da)s+=3;
 if(a.id===7&&aa>da)s+=2;
 return s;
}
function cpuCardScore(c){
 const p=CPU_PLAYER,opp=1-p;let s=Math.random()*.8;
 if(c.kind==='monster'){
  if(c.id===1)return-99;
  if(S.players[p].monster.every(Boolean))return-99;
  s+=cardAtk(c)*.45;
  if(c.id===8&&S.players[opp].magic.some(x=>x&&x.faceDown))s+=4;
  if(c.id===7)s+=3;if(c.id===4)s+=2.5;if(c.id===6)s+=1.7;
  if(c.id===12)s+=2.8;if(c.id===9)s+=2.2;
  return s;
 }
 if(c.mode==='trap'||c.mode==='both'){
  if(S.players[p].magic.some(x=>!x))s+=2.4;
  if([101,104,105,110].includes(c.id))s+=1.5;
 }
 if(c.mode==='instant'||c.mode==='both'){
  if(c.id===103)s+=2;
  if(c.id===107)s+=S.players[opp].life<=1?8:3;
  if(c.id===108&&fieldCards().some(x=>x.kind==='monster'&&x.id!==7))s+=3;
  if(c.id===109)s+=2.5;
  if(c.id===111&&S.players[p].hand.length>=2&&(S.grave.some(x=>x.kind==='monster')||fieldCards().some(x=>x.kind==='monster'&&x.id!==7)))s+=3;
  if(c.id===100&&S.grave.some(x=>x.kind==='monster')&&S.players[p].monster.some(x=>!x))s+=3;
  if(c.id===102&&S.players[p].hand.some(x=>x.kind==='monster')&&S.players[p].monster.some(x=>!x))s+=2.5;
  if(c.id===106)s+=1.6;
 }
 return s;
}
async function cpuPlayBestCard(){const hand=S.players[CPU_PLAYER].hand;if(!hand.length||S.actions<=0)return false;const ranked=hand.map(c=>({c:c,s:cpuCardScore(c)})).filter(x=>x.s>-20).sort((a,b)=>b.s-a.s);if(!ranked.length||ranked[0].s<1.2)return false;cpuCurrentCard=ranked[0].c;cpuDecisionContext=true;await playFromHand(ranked[0].c.uid);cpuDecisionContext=false;cpuCurrentCard=null;return true;}
async function cpuAttackBest(){const choices=[0,1].map(l=>({l:l,s:cpuAttackScore(l)})).filter(x=>x.s>-90).sort((a,b)=>b.s-a.s);if(!choices.length||choices[0].s<0.5)return false;cpuDecisionContext=true;await attackFlow();cpuDecisionContext=false;return true;}
async function cpuMaybeTime(){const p=CPU_PLAYER;if(S.players[p].timeUsed)return false;const diff=cpuBoardValue(p)-cpuBoardValue(1-p);if(!(S.players[p].life<=2||diff<-5))return false;cpuDecisionContext=true;await useTimeMagic();cpuDecisionContext=false;return true;}
async function runCpuTurn(){if(GAME_MODE!=='CPU'||S.turn!==CPU_PLAYER||S.gameover||cpuThinking)return;cpuThinking=true;$('cpuThinking').classList.remove('hidden');render();await sleep(650);try{await cpuMaybeTime();let guard=0;while(!S.gameover&&S.turn===CPU_PLAYER&&S.actions>0&&guard++<8){await sleep(430);const attackBest=Math.max(cpuAttackScore(0),cpuAttackScore(1));const cardBest=Math.max.apply(null,S.players[CPU_PLAYER].hand.map(cpuCardScore).concat([-99]));let acted=false;if(attackBest>=cardBest*.85&&attackBest>0.5)acted=await cpuAttackBest();else acted=await cpuPlayBestCard();if(!acted&&attackBest>0.5)acted=await cpuAttackBest();if(!acted)break;}if(!S.gameover&&S.turn===CPU_PLAYER){await sleep(400);cpuDecisionContext=true;await endTurn();cpuDecisionContext=false;}}finally{cpuThinking=false;$('cpuThinking').classList.add('hidden');render();}}
function checkStalemate(){if(S.gameover||S.deck.length>0)return;const mons=S.players[0].monster.filter(Boolean).length+S.players[1].monster.filter(Boolean).length;if(mons>0)return;const l0=S.players[0].life,l1=S.players[1].life;if(l0!==l1)return finish(l0>l1?0:1,'山札0・場にモンスターなし：ライフ判定');const f0=S.players[0].monster.filter(Boolean).length+S.players[0].magic.filter(Boolean).length,f1=S.players[1].monster.filter(Boolean).length+S.players[1].magic.filter(Boolean).length;if(f0!==f1)return finish(f0<f1?0:1,'ライフ同点：場のカードが少ない方の勝利');finish(null,'ライフ・場のカード数とも同じため引き分け');}
function finish(winner,msg){if(S.gameover)return;S.gameover=true;S.pending=[];recordStats(winner);$('gameoverTitle').textContent=winner===null?'DRAW':`${pName(winner)} WIN`;$('gameoverMsg').textContent=msg;$('gameover').classList.remove('hidden');render();}
function showGrave(){const cards=S.grave.slice().reverse();$('modalTitle').textContent=`GRAVE / 墓地 ${S.grave.length}枚`;$('modalOptions').innerHTML=cards.length?`<div class="graveGrid">${cards.map(c=>`<button class="graveItem" data-gid="${c.uid}"><b>${c.name}</b><small>${cardTypeText(c)}</small><small>${c.text||'効果なし'}</small></button>`).join('')}</div>`:'<div class="detailCard">墓地にカードはありません。</div>';$('modalCancel').style.display='block';$('modalCancel').textContent='閉じる';$('modal').classList.remove('hidden');document.querySelectorAll('[data-gid]').forEach(b=>b.onclick=()=>{const c=S.grave.find(x=>x.uid===Number(b.dataset.gid));if(c)showCardDetail(c,S.turn);});$('modalCancel').onclick=()=>{$('modal').classList.add('hidden');$('modalCancel').textContent='キャンセル';};}
function showRules(){
 const txt=[
 '共有デッキ / 初期ライフ4 / 初手4枚。P1・P2とも初期手札には必ずモンスター1枚以上を含む。先攻1ターン目はタイトルでAP1/AP2、ドローあり/なしを設定。その後はAP2。',
 '召喚・即時カード・罠セット・攻撃は各AP1。ATTACKはモンスター1体につき1ターン1回。召喚ターンは原則攻撃不可。失笑ライダーは相手の伏せ罠と同列に召喚すると突撃＋AP+1。',
 '貫通X：戦闘で相手よりATKが高く勝利した場合のみ相手ライフ-X。脱力X：戦闘した相手のATKを永久に-X。錆びたゴーレムは脱力による減少量が2倍。',
 '踏破：戦闘で自分が墓地へ行かず、相手を墓地へ送った時に発動。ドリルドリは貫通+1、反魔の死人は1ドロー。',
 '憑依：最初に召喚したプレイヤーがエンブレムを永久取得。そのプレイヤーの罠発動成功時、墓地の憑依モンスターを任意で召喚できる。',
 '信仰X：最初に召喚したプレイヤーがエンブレムを永久取得。自分ターン開始時、任意で1ターン1回、手札X枚を墓地へ送って墓地の信仰Xモンスターを召喚できる。',
 '憎悪：カード個体UIDごとに『手札からの召喚回数』を記録。腐天使は手札から2回目以降召喚するたびATK+2され、重複する。',
 '激おこドラゴン：通常召喚不可。攻撃がプレイヤーへ到達した瞬間、相手ライフに関係なく特殊勝利。',
 '復活の魔法は即時発動専用で、罠としてセットできない。加速の儀：自分ターン開始時または破壊時に2ドロー。自分ターン中に発動した場合AP+1（最大4）。脱出の儀は同列への攻撃時に発動し、攻撃モンスターを手札へ戻して両者1ドロー。',
 '破壊の魔法：罠専用。セットした次の相手エンドフェイズに同じ列のカードをすべて墓地へ送る。',
 'TIME MAGIC：各プレイヤー1ゲーム1回。使用時ライフ半減（最低1）。①場のモンスター1体を破壊して墓地へ(AP0) ②3ドロー1枚をデッキ下へ(AP1) ③自分の場とカード状態を前ターン終了時へ戻してターンスキップ(AP2)。',
 'TIME MAGICの巻き戻し対象は配置・ATK増減・ATK半減・貫通・脱力・戦闘回数・召喚回数・召喚酔い・コントロール状態。手札・墓地・ライフ・デッキ・通常ドロー・乱数結果・エンブレムは巻き戻さない。',
 '賭博の書：通常は2ドロー後に手札2枚をデッキへ戻す。引いた2枚が同じカテゴリならAP+1。山札が2枚未満なら両者の手札を山札へ戻してシャッフルし、互いに2ドロー。',
 '手札上限5。ターン終了時に超過分を選びデッキ下へ。V1.3試作デッキはモンスター12種＋マジック12種を各1枚。',
 '場を対象にする効果は原則フィールドから直接タップ。VS CPUではP2をNORMAL CPUが担当し、CPUは相手の非公開手札や伏せ罠の正体を判断材料にしない。'
 ];
 choose('RULES / v0.6.3 / V1.3',txt.map((x,i)=>({label:`${i+1}. ${x}`,value:i})),true);
}
async function startNewGame(){
 uid=1;cpuThinking=false;cpuDecisionContext=false;clearDigestBanners();S=newState();
 $('titleScreen').classList.add('hidden');S.turn=S.starter;
 log(`先攻は ${pName(S.starter)} / 初回AP${OPENING_AP} / ${FIRST_TURN_DRAW?'先攻ドローあり':'先攻ドローなし'} / 初手モンスター1枚以上保証`);
 await startTurn(S.starter,true);
 if(GAME_MODE==='CPU'&&S.starter===CPU_PLAYER){setHandPrivate(false);setTimeout(runCpuTurn,500);}
 else showHandoff(S.starter,GAME_MODE==='CPU'?'初手4枚（モンスター1枚以上保証）を確認してREADYを押してください。':'初手4枚（両プレイヤーともモンスター1枚以上保証）は相手に見せず、READYを押してください。');
}
function boot(){if(!S){uid=1;S=newState();render();}showTitle();}
$('attackBtn').onclick=attackFlow;$('timeBtn').onclick=useTimeMagic;$('endBtn').onclick=endTurn;$('rulesBtn').onclick=showRules;$('graveBtn').onclick=showGrave;$('resetBtn').onclick=()=>{if(confirm('ゲームを終了してタイトルへ戻りますか？')){['handoff','modal','gameover','digest'].forEach(id=>$(id).classList.add('hidden'));showTitle();}};$('againBtn').onclick=()=>{$('gameover').classList.add('hidden');showTitle();};
$('mode2p').onclick=()=>{GAME_MODE='2P';refreshTitleControls();};$('modeCpu').onclick=()=>{GAME_MODE='CPU';refreshTitleControls();};$('ap1Btn').onclick=()=>{OPENING_AP=1;refreshTitleControls();};$('ap2Btn').onclick=()=>{OPENING_AP=2;refreshTitleControls();};$('drawOnBtn').onclick=()=>{FIRST_TURN_DRAW=true;refreshTitleControls();};$('drawOffBtn').onclick=()=>{FIRST_TURN_DRAW=false;refreshTitleControls();};$('clearStatsBtn').onclick=()=>{if(confirm('対戦統計をリセットしますか？')){try{localStorage.removeItem(STATS_KEY);}catch(e){}renderStats();}};$('startGameBtn').onclick=startNewGame;
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',boot);}else{boot();}
</script>
