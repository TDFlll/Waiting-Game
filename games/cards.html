*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;min-height:100%;overscroll-behavior:none}button{font:inherit;color:inherit}.app{min-height:100dvh;display:flex;flex-direction:column;padding:max(8px,env(safe-area-inset-top)) 8px max(10px,env(safe-area-inset-bottom));gap:7px;max-width:620px;margin:auto}.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}.brand{text-align:center;font-weight:900;letter-spacing:.08em;font-size:clamp(12px,3.3vw,15px)}.brand small{display:block;font-size:9px;color:var(--muted);letter-spacing:.15em}.score{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:6px 8px;box-shadow:var(--shadow);font-size:11px;line-height:1.25}.score.p2{text-align:right}.score b{font-size:18px}.p1c{color:var(--p1)}.p2c{color:var(--p2)}.status{background:#272720;color:#f6f0e3;border-radius:11px;padding:7px 10px;display:flex;justify-content:space-between;align-items:center;font-size:11px;gap:6px}.status strong{font-size:13px}.board{display:grid;grid-template-rows:auto auto auto;gap:5px}.sideLabel{text-align:center;font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--muted)}.field{display:grid;grid-template-columns:1fr 1fr;gap:6px}.lane{display:grid;grid-template-rows:auto auto;gap:4px;background:#e8dfcd;border:1px solid var(--line);border-radius:12px;padding:5px}.slot{position:relative;min-height:clamp(70px,18vw,98px);border:1.5px dashed #a69a83;border-radius:9px;background:#f9f3e6;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;overflow:hidden}.slot.magic{min-height:clamp(45px,11vw,60px)}.slot.empty::after{content:attr(data-empty);color:#aaa18f;font-size:9px}.card{width:100%;height:100%;min-height:inherit;border:1px solid #8e856f;border-radius:8px;background:#fffdf7;padding:5px;display:flex;flex-direction:colu .detailCard{background:#fffdf7;border:1px solid var(--line);border-radius:12px;padding:12px}.detailCard h4{margin:0 0 5px;font-size:17px}.detailCard .detailType{font-size:10px;color:var(--muted);margin-bottom:9px}.detailCard .detailEffect{font-size:12px;line-height:1.6}.slot.inspectable{cursor:pointer}.slot.inspectable:active{transform:scale(.985)}
.digest{background:var(--paper);border-radius:18px;padding:20px 16px;width:min(92vw,430px);text-align:center;box-shadow:0 20px 50px #0006}.digest h2{margin:0 0 5px;font-size:22px}.digestList{margin-top:12px;display:grid;gap:7px;text-align:left}.digestItem{background:#eee4d2;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:11px;font-weight:800;opacity:0;transform:translateY(8px);animation:digestIn .3s ease forwards}.digestItem.current{background:#fffaf0;box-shadow:0 4px 12px #0001}@keyframes digestIn{to{opacity:1;transform:none}}


.turnDigestBar{display:none;background:#efe4d0;border:1px solid var(--line);border-radius:11px;padding:6px 7px;box-shadow:var(--shadow)}.turnDigestBar.show{display:block}.turnDigestHead{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:5px;font-size:8px;font-weight:950;letter-spacing:.12em;color:var(--muted)}.turnDigestList{display:flex;gap:5px;overflow-x:auto;padding-bottom:1px;scroll-snap-type:x proximity}.turnDigestChip{flex:0 0 auto;max-width:min(72vw,320px);background:#fffaf0;border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:9px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;scroll-snap-align:start}.turnDigestChip.effect{border-color:#8b6caa;background:#f4eef9}.effectFlash{position:fixed;left:50%;top:39%;transform:translate(-50%,-50%) scale(.88);z-index:68;width:min(86vw,390px);padding:13px 16px;border-radius:16px;background:#25231fee;color:#fff;text-align:center;box-shadow:0 18px 45px #0006;opacity:0;pointer-events:none;transition:opacity .16s ease,transform .2s ease}.effectFlash.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.effectFlash::before{content:"✦ CARD EFFECT ✦";display:block;font-size:8px;letter-spacing:.18em;color:#e8d6ff;margin-bottom:5px}.effectFlash .effectName{font-size:13px;font-weight:950;line-height:1.35}.effectFlash.show::after{content:"";position:absolute;inset:-8px;border:2px solid #ffffff55;border-radius:22px;animation:effectRing .72s ease-out forwards}@keyframes effectRing{from{opacity:.9;transform:scale(.9)}to{opacity:0;transform:scale(1.08)}}

.app{transition:background .22s ease,border-color .22s ease}

<div class="app">
  <div class="topbar">
    <div class="score p1score" id="score1"></div>

  </div>

  </div>

</div></div>

<script>
'use strict';

const BASE_CARDS=[
{"id":1,"name":"激おこドラゴン","kind":"monster","atk":12,"text":"通常召喚不可。AP1を消費し、自分の場のモンスター1体を墓地へ送って手札から特殊召喚。場に出た時、相手の場のカード1枚を墓地へ送る（対象なしなら不発）。貫通1。","pierce":1},
{"id":2,"name":"錆びたゴーレム","kind":"monster","atk":11,"text":"脱力の影響を2倍受ける。最初の2回の戦闘では破壊されず、成立した戦闘が3回になると墓地へ。"},
{"id":3,"name":"こどもドラゴン","kind":"monster","atk":1,"text":"正面にモンスターがいてもプレイヤーへ直接攻撃可能。ATK8以上の相手との戦闘では、戦闘は成立するが戦闘では破壊されない。"},
{"id":4,"name":"ドリルドリ","kind":"monster","atk":7,"pierce":1,"text":"貫通1。踏破：貫通エンブレムを得る（重複なし）。以後、自分が召喚するモンスターに貫通1を付与。既に貫通があれば代わりにATK+1。"},
{"id":5,"name":"ごごご幽霊","kind":"monster","atk":3,"debilitate":3,"possession":true,"text":"憑依。脱力3。最初に召喚したプレイヤーは憑依エンブレムを得る。そのプレイヤーの罠発動成功時、墓地から任意で召喚できる。"},
{"id":6,"name":"デッドアイズ","kind":"monster","atk":4,"text":"墓地へ送られた時、相手のATK7以上モンスターすべてに脱力5を与える"},

function shuffle(a){
 for(let i=a.length-1;i>0;i--){
  let j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];

function dealOpeningHand(deck){
 const hand=[];
 const mons=[];
 for(let i=0;i<deck.length;i++)if(deck[i].kind==='monster')mons.push(i);
 if(mons.length){
  const pick=mons[Math.floor(Math.random()*mons.length)];
  hand.push(deck.splice(pick,1)[0]);
 }
 while(hand.length<4&&deck.length)hand.push(deck.pop());
 return shuffle(hand);
}

}

function waitDecisionHandoff(player,title,msg){return new Promise(res=>{setHandPrivate(true);clearTransientEffects();$('handoffTitle').textContent=title||`${pName(player)} の選択です`;$('handoffMsg').textContent=msg||'選択するプレイヤーに端末を渡してください。手札は表示されません。';$('handoff').classList.remove('hidden');$('readyBtn').onclick=()=>{$('handoff').classList.add('hidden');setHandPrivate(true);render();res();};});}
async function withDecisionPlayer(player,label,fn){const old=decisionPlayer;if(old===player){return await fn();}const turnOwner=S.turn;decisionPlayer=player;let oldCpu=cpuDecisionContext;try{if(GAME_MODE==='CPU'&&player===CPU_PLAYER){cpuDecisionContext=true;return await fn();}if(player!==turnOwner){await waitDecisionHandoff(player,`${pName(player)} REACTION`,label||'効果の選択権があります。端末を渡してください。');const result=await fn();if(GAME_MODE==='2P'){await waitDecisionHandoff(turnOwner,`${pName(turnOwner)} のターンへ戻ります`,'選択処理が完了しました。元のターンプレイヤーに端末を戻してください。');setHandPrivate(false);render();}else if(GAME_MODE==='CPU'&&turnOwner===CPU_PLAYER){setHandPrivate(false);render();}return result;}return await fn();}finally{cpuDecisionContext=oldCpu;decisionPlayer=old;}}
function cpuPickOption(title,opts){if(!opts||!opts.length)return null;let scored=opts.map((o,i)=>({i:i,s:0.15*Math.random(),o:o}));for(const x of scored){const label=(x.o.label||'')+' '+(x.o.sub||'');if(title.startsWith('MAGIC /')&&x.o.value==='destroy')x.s+=10;if(/相手ライフ|直接攻撃/.test(label))x.s+=4;if(/コントロール/.test(label))x.s+=3;if(/手札をランダム1枚奪/.test(label))x.s+=2.4;if(/墓地.*手札/.test(label))x.s+=2;if(/召喚|復活/.test(label))x.s+=1.8;if(/即時発動/.test(label))x.s+=1.2;if(/罠としてセット/.test(label))x.s+=1.5;if(/デッキの底へ/.test(label))x.s+=0.4;if(/LEFT|RIGHT/.test(label))x.s+=0.2;if(/場のモンスター.*破壊/.test(label)&&S.players[1-CPU_PLAYER].monster.some(c=>c&&c.id===3))x.s+=20;if(/エンブレム.*破壊/.test(label))x.s+=3;if(/1ドロー/.test(label))x.s+=1;if(/突撃/.test(label))x.s+=2;if(/相手の錆びたゴーレム.*墓地/.test(label))x.s+=6;const m=label.match(/ATK\s*(\d+)/);if(m)x.s+=Number(m[1])*.12;}
scored.sort((a,b)=>b.s-a.s);return scored[0].i;}
function cpuPickField(title,filter){const cand=[];for(let p=0;p<2;p++)for(let l=0;l<2;l++)for(const z of ['monster','magic']){const c=S.players[p][z][l];if(filter(p,l,z,c))cand.push({p:p,l:l,zone:z,c:c});}if(!cand.length)return null;let best=cand[0],bestS=-999;for(const x of cand){let sc=Math.random()*.4;if(/攻撃するモンスター/.test(title)){sc+=cpuAttackScore(x.l)*2;}if(/召喚先|復活先|MONSTER/.test(title)){if(x.p===CPU_PLAYER)sc+=2;if(!S.players[1-CPU_PLAYER].monster[x.l])sc+=1.2;else sc+=0.5;}if(/強化/.test(title)){if(x.p===CPU_PLAYER)sc+=3;sc+=(x.c?cardAtk(x.c):0)*.15;}if(/脱力/.test(title)){if(x.p!==CPU_PLAYER)sc+=3;sc+=(x.c?cardAtk(x.c):0)*.2;}if(/コントロール/.test(title)){if(x.p!==CPU_PLAYER)sc+=3;sc+=(x.c?cardAtk(x.c):0)*.2;}if(/入れ替える場/.test(title)){if(x.p!==CPU_PLAYER)sc+=1.5;}if(/墓地へ|破壊|半減/.test(title)){if(x.p!==CPU_PLAYER)sc+=6;else sc-=8;if(x.p!==CPU_PLAYER&&x.c?.id===3)sc+=12;}if(/コストにする/.test(title)&&x.p===CPU_PLAYER)sc-=x.c?cardAtk(x.c):0;if(/突撃/.test(title)&&x.p===CPU_PLAYER)sc+=4;if(/配置先/.test(title)&&x.p===CPU_PLAYER)sc+=2;if(sc>bestS){bestS=sc;best=x;}}return{p:best.p,l:best.l,zone:best.zone};}
function chooseFieldSlot(msg,filter){if(cpuShouldAuto(msg)){return new Promise(res=>setTimeout(()=>res(cpuPickField(msg,filter)),260));}return new Promise(res=>{fieldPickResolve=res;fieldPickFilter=filter;$('pickHint').textContent=msg+' ｜ ここをタップでキャンセル';$('pickHint').classList.remove('hidden');$('pickHint').onclick=()=>{const r=fieldPickResolve;fieldPickResolve=null;fieldPickFilter=null;$('pickHint').classList.add('hidden');render();r(null);};render();});}
function choose(title,opts,cancel=true){if(cpuShouldAuto(title)){return new Promise(res=>setTimeout(()=>{const ix=cpuPickOption(title,opts);res(ix===null?null:opts[ix].value);},240));}return new Promise(res=>{choiceResolve=res;$('modalTitle').textContent=title;$('modalOptions').innerHTML=opts.map((o,i)=>`<button class="opt" data-i="${i}">${o.label}${o.sub?`<small>${o.sub}</small>`:''}</button>`).join('');$('modalCancel').style.display=cancel?'block':'none';$('modalCancel').textContent='キャンセル';$('modal').classList.remove('hidden');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const v=opts[+b.dataset.i].value;$('modal').classList.add('hidden');choiceResolve=null;res(v);});$('modalCancel').onclick=()=>{$('modal').classList.add('hidden');choiceResolve=null;res(null);};});}

async function faithStartOption(p){
 if(S.gameover||!S.players[p].faithEmblem||S.players[p].faithUsedTurn===S.turnNo)return;
 const empty=[0,1].filter(l=>!S.players[p].monster[l]);
 if(!empty.length)return;
 const candidates=graveFor(p).filter(c=>c.kind==='monster'&&c.faith&&c.faith>0&&c.faith<=S.players[p].hand.length);
 if(!candidates.length)return;
 // CPUは「復活する戦力」と「捨てる手札の価値」を比較して信仰を使う。
 if(GAME_MODE==='CPU'&&p===CPU_PLAYER){
  const handRank=S.players[p].hand.map(c=>({c,s:Math.max(0,cpuCardScore(c))})).sort((a,b)=>a.s-b.s);
  let best=null;
  for(const c of candidates){
   const cost=c.faith||0;
   if(handRank.length<cost)continue;
   const discardValue=handRank.slice(0,cost).reduce((a,x)=>a+x.s,0);
   let summonValue=cardAtk(c)*0.65;
   if(c.id===12)summonValue+=4;
   if(c.id===7)summonValue+=3;
   if(c.id===4)summonValue+=2.5;
   if(c.id===6)summonValue+=1.5;
   if(c.id===9)summonValue+=1.2;
   const score=summonValue-discardValue*0.75+(S.players[p].monster.filter(Boolean).length===0?2:0);
   if(!best||score>best.score)best={c,score,cost};
  }
  if(!best||best.score<2.2){log('CPU：信仰は温存');return;}
  S.players[p].faithUsedTurn=S.turnNo;
  for(let n=0;n<best.cost;n++){
   const current=S.players[p].hand.map(c=>({c,s:Math.max(0,cpuCardScore(c))})).sort((a,b)=>a.s-b.s)[0];
   if(!current)break;
   const i=S.players[p].hand.findIndex(x=>x.uid===current.c.uid);
   const dc=S.players[p].hand.splice(i,1)[0];
   await sendGrave(dc,'faith-cost',true,false,p);
  }
  const graveCard=takeGrave(best.c.uid,p);if(!graveCard)return;
  let lane=empty[0];
  if(empty.length>1){
   const laneScores=empty.map(l=>({l,s:(!S.players[1-p].monster[l]?1.5:0)+(S.players[1-p].magic[l]?-.4:0)})).sort((a,b)=>b.s-a.s);
   lane=laneScores[0].l;
  }
  log(`CPU が信仰${best.cost}を使用（評価 ${best.score.toFixed(1)}）`);
  await summon(graveCard,p,lane,false,false);
  await resolvePending();return;
 }
 const opts=candidates.map(c=>({label:`${c.name} を信仰で召喚`,sub:`手札${c.faith}枚を墓地へ / ${cardTypeText(c)}`,value:c.uid}));
 const id=await choose(`${pName(p)}：信仰エンブレム（任意・1ターン1回）`,opts,true);
 if(!id)return;
 const target=graveFor(p).find(c=>c.uid===id);if(!target)return;
 const cost=target.faith||0;if(S.players[p].hand.length<cost)return;
 const selected=[];
 for(let n=0;n<cost;n++){
  const available=S.players[p].hand.filter(c=>!selected.includes(c.uid));
  const cid=await choose(`信仰${cost}：墓地へ送る手札 ${n+1}/${cost}`,available.map(c=>({label:c.name,sub:cardTypeText(c),value:c.uid})),true);
  if(!cid)return; selected.push(cid);
 }
 let lane=empty[0];
 if(empty.length>1){
  const pick=await chooseFieldSlot(`${pName(p)}：信仰召喚先をタップ`,(pp,ll,z,cc)=>pp===p&&z==='monster'&&!cc);
  if(!pick)return; lane=pick.l;
 }
 S.players[p].faithUsedTurn=S.turnNo;
 for(const cid of selected){const i=S.players[p].hand.findIndex(c=>c.uid===cid);if(i>=0){const dc=S.players[p].hand.splice(i,1)[0];await sendGrave(dc,'faith-cost',true,false,p);}}
 const graveCard=takeGrave(id,p);if(!graveCard)return;
 log(`${pName(p)} が信仰${cost}を使用`);
 await summon(graveCard,p,lane,false,false);await resolvePending();
}

  log(`${pName(p)} が罠をセット`);
  await evaluateAutoTraps();await resolvePending();busy=false;render();return;
 }
 busy=true;
 S.actions--;const ok=await activateInstant(c,p,idx);
 if(!ok)S.actions++;
 await resolvePending();await evaluateAutoTraps();busy=false;render();

async function summon(c,p,l,normal=false,fromHand=false){
 if(c.owner===null||c.owner===undefined)c.owner=p;
 c.controller=p;c.zone='monster';c.lane=l;c.faceDown=false;c.playedTurn=S.turnNo;c.summonedTurn=S.turnNo;
 const firstSummon=(c.originalSummoner===null||c.originalSummoner===undefined);
 if(firstSummon)c.originalSummoner=p;
 c.summonCount=(c.summonCount||0)+1;
 if(fromHand)c.handSummonCount=(c.handSummonCount||0)+1;
 if(c.possession&&firstSummon){S.players[p].possessionEmblem=true;log(`${pName(p)} が「憑依」エンブレムを獲得`);}
 if(c.faith&&firstSummon){S.players[p].faithEmblem=true;log(`${pName(p)} が「信仰」エンブレムを獲得`);}
 if(c.hatred&&fromHand&&c.handSummonCount>=2){c.atkMod+=(c.hatred||0);log(`${c.name}：憎悪が発動。ATK+${c.hatred}（手札からの召喚${c.handSummonCount}回目）`);}
 const riderBonus=(c.id===8&&!!(S.players[1-p].magic[l]&&S.players[1-p].magic[l].faceDown));
 c.hasCharge=riderBonus;S.players[p].monster[l]=c;
 if(c.id===8&&S.players[1-p].monster[l]){c.pierceGranted=true;log(c.name+'：同列に相手モンスターがいるため貫通1')}
 if(S.players[p].pierceEmblem)grantPierce(c,'貫通エンブレム');
 log(`${pName(p)} が ${c.name} を${l===0?'左':'右'}列に召喚`);
 if(riderBonus){addAP(p,1);log(`${c.name}：突撃 / AP+1`);}
 if(c.id===1&&!S.gameover)S.pending.push({type:'dragonSummon',owner:p,source:c});
 if(c.id===9&&!S.gameover)S.pending.push({type:'necromancerSummon',owner:p,source:c});
 if(c.id===11&&!S.gameover)S.pending.push({type:'swapPot',owner:p,source:c});
 if(c.id!==9)await triggerTrapOnSummon(p,l,c);
}

async function activateInstant(c,p,handIdx){
 // カードは効果の選択が確定するまで手札に残す。キャンセル時はAPもカードも消費しない。
 const ok=await resolveMagicEffect(c,p,p);
 if(!ok)return false;
 const idx=S.players[p].hand.findIndex(x=>x.uid===c.uid);
 if(idx<0)return false;
 S.players[p].hand.splice(idx,1);
 if(c.owner===null||c.owner===undefined)c.owner=p;
 c.controller=p;c.playedTurn=S.turnNo;
 log(`${pName(p)} が ${c.name} を発動`);

async function resolveMagicEffect(c,ctrl,originalP){
 if(c.id===100)return await revivalEffect(ctrl,null);

  return true;
 }

async function forgeryEffect(ctrl){

function findAnywhere(id,excludeUid,preferredDeck=null){

   const i=S.players[p].hand.findIndex(match);if(i>=0)return{area:'hand',p,i,card:S.players[p].hand[i]};
   for(let l=0;l<2;l++){const c=S.players[p].monster[l];if(c&&match(c))return{area:'monster',p,l,card:c}}
  }
  const graveLoc=locateGraveCard(match);if(graveLoc)return graveLoc;
  return locateDeckCard(match);
 };
 return (S.deckMode==='double'&&isPlayerIndex(preferredDeck)?find(true):null)||find(false);
}
function extractLocation(loc){const c=loc.card;if(loc.area==='hand')S.players[loc.p].hand.splice(loc.i,1);else if(loc.area==='monster')S.players[loc.p].monster[loc.l]=null;else if(loc.area==='grave')graveFor(loc.p).splice(loc.i,1);else if(loc.area==='deck')deckFor(loc.p).splice(loc.i,1);return c;}

async function startNewGame(){

 log(`${deckModeName(S.deckMode)} / 先攻は ${pName(S.starter)} / 初回AP${OPENING_AP} / ${FIRST_TURN_DRAW?'先攻ドローあり':'先攻ドローなし'} / 初手モンスター1枚以上保証`);
 await startTurn(S.starter,true);
 if(GAME_MODE==='CPU'&&S.starter===CPU_PLAYER){setHandPrivate(false);setTimeout(runCpuTurn,500);}
 else showHandoff(S.starter,GAME_MODE==='CPU'?'初手4枚（モンスター1枚以上保証）を確認してREADYを押してください。':'初手4枚（両プレイヤーともモンスター1枚以上保証）は相手に見せず、READYを押してください。');
}

$('singleDeckBtn').onclick=()=>{DECK_MODE='single';refreshTitleControls();};$('doubleDeckBtn').onclick=()=>{DECK_MODE='double';refreshTitleControls();};
$('mode2p').onclick=()=>{GAME_MODE='2P';refreshTitleControls();};$('modeCpu').onclick=()=>{GAME_MODE='CPU';refreshTitleControls();};$('ap1Btn').onclick=()=>{OPENING_AP=1;refreshTitleControls();};$('ap2Btn').onclick=()=>{OPENING_AP=2;refreshTitleControls();};$('drawOnBtn').onclick=()=>{FIRST_TURN_DRAW=true;refreshTitleControls();};$('drawOffBtn').onclick=()=>{FIRST_TURN_DRAW=false;refreshTitleControls();};$('clearStatsBtn').onclick=()=>{if(confirm('対戦統計をリセットしますか？')){try{localStorage.removeItem(STATS_KEY);}catch(e){}renderStats();}};$('startGameBtn').onclick=startNewGame;
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',boot);}else{boot();}

<script data-wg-home-confirm>
(function(){
  let pending=null;
  window.wgConfirmHome=function(message){
    if(pending)return pending;
    const previous=document.activeElement;
    const dialog=document.createElement('dialog');
    dialog.setAttribute('aria-label','サイトTOPへ戻る確認');
    dialog.style.cssText='border:1px solid #cfc8ba;border-radius:18px;padding:22px;width:min(90vw,380px);max-height:85dvh;overflow:auto;background:#fffaf1;color:#202522;box-shadow:0 16px 60px #0005;font:16px/1.6 system-ui,sans-serif;text-align:center;';
    const text=document.createElement('p');text.textContent=message||'サイトTOPへ戻りますか？';text.style.cssText='margin:0 0 18px;font-weight:700;white-space:pre-wrap;';
    const actions=document.createElement('div');actions.style.cssText='display:flex;gap:12px;';
    const no=document.createElement('button'),yes=document.createElement('button');
    for(const button of [no,yes]){button.type='button';button.style.cssText='flex:1;min-height:48px;border:1px solid #958b76;border-radius:12px;padding:10px;background:#fffaf1;color:#202522;font:700 16px system-ui,sans-serif;cursor:pointer;';}
    no.textContent='NO';yes.textContent='YES';yes.style.background='#202522';yes.style.color='#fffaf1';
    actions.append(no,yes);dialog.append(text,actions);document.body.append(dialog);
    pending=new Promise(resolve=>{
      function finish(result){dialog.close();dialog.remove();pending=null;previous?.focus?.();resolve(result);}
      no.onclick=()=>finish(false);yes.onclick=()=>finish(true);
      dialog.addEventListener('cancel',event=>{event.preventDefault();finish(false)});
      dialog.addEventListener('click',event=>{if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)finish(false)}});
    });
    dialog.showModal();no.focus();return pending;
  };
  const approved=new WeakSet();
  document.addEventListener('click',event=>{
    const link=event.target.closest?.('a.wg-home');if(!link)return;
    if(approved.has(link))return;
    event.preventDefault();event.stopImmediatePropagation();
    if(pending)return;
    window.wgConfirmHome().then(yes=>{if(!yes)return;approved.add(link);try{link.click()}finally{approved.delete(link)}});
  },true);
})();
</script>
