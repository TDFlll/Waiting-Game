function randomOpenTick(){

function isAdjacent(a,b){return Math.abs(Math.floor(a/4)-Math.floor(b/4))+Math.abs(a%4-b%4)===1}
function effects(final=false){let b=game.board,known=c=>final||c.revealed;const weight=b.find(c=>c.kind==='weight'&&known(c));const disabled=new Set();if(weight)b.forEach((c,i)=>{if(['carrot','gold','good','bad'].includes(c.kind)&&isAdjacent(i,weight.pos))disabled.add(i)});const omens=new Set(b.filter(c=>c.kind==='omen'&&known(c)).map(c=>c.color));let horses=b.filter(c=>c.kind==='horse').map(c=>({...c,score:0,disqualified:omens.has(c.color)}));for(let card of b){if(!known(card)||disabled.has(card.pos))continue;const r=Math.floor(card.pos/4),col=card.pos%4;for(let h of horses){let hr=Math.floor(h.pos/4),hc=h.pos%4;let delta=0;if(card.kind==='carrot'||card.kind==='gold'){let inCross=(hc===col||hr===r);if(inCross)delta=card.kind==='gold'?2:1}else if(card.kind==='good'||card.kind==='bad'){if(isAdjacent(card.pos,h.pos))delta=card.kind==='good'?1.5:-1}h.score+=delta}}
let eligible=horses.filter(h=>!h.disqualified);eligible.sort((a,b)=>b.score-a.score||a.priority-b.priority);return {horses,disabled,omens,eligible,fullyKnown:omens.size===1}}
function tileHtml(c,canPick=false,final=false){let info=effects(final),disabled=info.disabled.has(c.pos);let base=`<span class="pos">${'ABCD'[c.pos%4]}${Math.floor(c.pos/4)+1}</span>`;if(!c.revealed&&!final)return `<button class="tile back ${canPick?'pick':''}" ${canPick?`onclick="flip(${c.pos})"`:'disabled'}><span class="q">✦</span><span class="detail">占い</span>${base}</button>`;if(c.kind==='horse'){let h=info.horses.find(x=>x.id===c.id);return `<div class="tile horse"><div class="horse-top"><span class="horse-number" aria-label="出走番号・同点優先番号 ${c.id}番">${c.id}</span><span class="score">${h.score>=0?'+':''}${h.score}点</span><span class="horse-status" aria-label="${h.disqualified?'失格':'失格なし'}">${h.disqualified?'❌':''}</span></div><img class="horse-art" src="${HORSE_ART[c.color]}" alt="${c.color}の馬">${base}</div>`}

function passEnter(){if(game.mode==='forcePass'){game.screen='force';game.mode='view'}else{game.screen='play';game.mode='view'}render()}
function chooseFlip(){if(game.screen!=='play'||game.openMode!=='free')return;game.mode='flip';game.pending=null;render()}
function flip(pos){if(game.screen!=='play'||game.openMode!=='free'||game.mode!=='flip')return;let c=game.board[pos];if(!c||c.revealed)return;c.revealed=true;game.pending=null;game.mode='view';if(game.players.every(purchased)){enterResult();return}if(publicCount()>=9){beginForced();return}game.current=1-game.current;game.screen='pass';game.passText='次のプレイヤーへ';render()}

function showPrivate(kind){if(kind==='review'){let p=game.players[game.current];modalHost.innerHTML=`<div class="overlay"><div class="modal"><h2>🔐 ${playerLabel(game.current)}の馬券</h2><p>現在残金：${money(p.cash)}</p>${p.tickets.length?p.tickets.map(ticketHtml).join(''):'<p class="note">購入済み馬券はありません。</p>'}<button class="primary full" onclick="closeModal()">閉じる（秘密情報を隠す）</button></div></div>`;return}const p=game.players[game.current];let options=HORSES.map(h=>`<option value="${h.id}">${h.id}番 ${h.color}</option>`).join('');modalHost.innerHTML=`<div class="overlay"><div class="modal"><h2>🎫 ${playerLabel(game.current)} 馬券購入</h2><p class="note">残金：${money(p.cash)} ／ 購入 ${p.tickets.length}/2枚<br>確定後は変更できません。</p>${privateTicketsHtml(p)}<label>馬券の種類</label><select id="buyType" onchange="updateBuyForm()"><option value="win">単勝（1着）</option><option value="exact">馬単（1着→2着）</option></select><div class="space"></div><div class="choice"><div><label id="labelFirst">1着の馬</label><select id="buyFirst">${options}</select></div><div id="secondGroup" class="hide"><label>2着の馬</label><select id="buySecond">${options.replace('value="1"','value="1"')}</select></div></div><div class="space"></div><label>賭け金（100円単位・試作設定）</label><input type="number" id="buyAmount" inputmode="numeric" min="100" max="${p.cash}" step="100" value="${Math.min(1000,p.cash)}"><div class="row" style="margin-top:7px"><button class="ghost" onclick="setAmount(0.25)">25%</button><button class="ghost" onclick="setAmount(.5)">50%</button><button class="ghost" onclick="setAmount(1)">全額</button></div><p id="payoutPreview" class="note"></p><button class="gold full bigbtn" onclick="confirmBuy('${kind}')">この内容で購入する</button><div class="space"></div><button class="ghost full" onclick="closeModal()">購入せず戻る</button></div></div>`;document.getElementById('buySecond').value='2';['buyType','buyAmount','buyFirst','buySecond'].forEach(id=>document.getElementById(id).addEventListener('input',updateBuyForm));updateBuyForm()}
function updateBuyForm(){let typ=document.getElementById('buyType').value;document.getElementById('secondGroup').classList.toggle('hide',typ==='win');let amt=Number(document.getElementById('buyAmount').value);document.getElementById('payoutPreview').textContent=`倍率 ×${odds(typ).toFixed(2)} ／ 的中時の払戻見込 ${money(Math.floor(Math.max(0,amt)*odds(typ)))}`}

function confirmBuy(kind){if(!modalHost.innerHTML||!['play','force'].includes(game.screen))return;if(kind==='randomBuy'&&(game.openMode!=='random'||game.mode!=='stopped'))return;let p=game.players[game.current],type=document.getElementById('buyType').value,first=Number(document.getElementById('buyFirst').value),second=Number(document.getElementById('buySecond').value),amt=Number(document.getElementById('buyAmount').value);if(!Number.isSafeInteger(amt)||amt<=0||amt%100!==0||amt>p.cash){alert('所持金以内で、100円単位の金額を入力してください。');return}if(type==='exact'&&first===second){alert('馬単は異なる2頭を選んでください。');return}if(purchased(p)){alert('購入できません。');closeModal();return}let ticket={type,first,second:type==='exact'?second:null,amount:amt,odds:odds(type),count:publicCount()};p.cash-=amt;p.tickets.push(ticket);closeModal(false);if(kind==='randomBuy'){nextRandomTurn();return}if(kind==='forceBuy'){game.forcedAt++;forceAdvance()}else{game.pending=true;game.mode='flip';render()}}

function enterResult(){stopRandomOpen();game.screen='result';game.stage=0;game.result=null;render()}
function calculateResult(){let info=effects(true),winner=info.eligible[0],second=info.eligible[1];let totals=game.players.map(p=>{let payout=0;for(let t of p.tickets){t.hit=t.type==='win'?t.first===winner.id:t.first===winner.id&&t.second===second.id;t.payout=t.hit?Math.floor(t.amount*t.odds):0;payout+=t.payout}return p.cash+payout});game.result={winner,second,totals};return game.result}
function renderResult(){let s=game.stage,o=`<div class="row"><span class="badge em">ROUND ${game.round}/2</span><span class="badge">確認フェイズ</span></div>`;if(s===0){o+=`<section class="panel center"><h2>🎫 馬券、一斉公開！</h2><p class="note">未公開カードはまだ伏せられています。</p><div class="players">${game.players.map((p,i)=>`<div class="pl"><strong>${i?'🔴':'🔵'} ${playerLabel(i)}</strong>${p.tickets.length?p.tickets.map(ticketHtml).join(''):'<p class="note">購入なし</p>'}</div>`).join('')}</div><div class="space"></div><button class="primary full bigbtn" onclick="startCountdown()">🏁 結果を見る</button></section>`}else if(s===1){o+=`<section class="panel center gate"><div class="count" id="countText">3</div><p>運命のカードが公開されます</p><button class="ghost" onclick="revealNow()">スキップ</button></section>`}else if(s===2){o+=`<section class="panel"><h2>🔮 すべてのカードが公開！</h2>${boardHtml(false,true)}<p class="note">無効化されたカードは暗く表示されます。馬の得点は最終値です。</p><button class="primary full bigbtn" onclick="advanceResult()">🏆 1着・2着を発表</button></section>`}else if(s===3){let r=game.result||calculateResult();o+=`<section class="panel center"><h2>🏆 最終着順</h2><div class="rankrow"><div class="rankcard"><div>🥇 1着</div><div class="horseemoji"><img class="rank-art" src="${HORSE_ART[r.winner.color]}" alt="${r.winner.color}"></div><h2>${r.winner.id}番 ${r.winner.color}</h2><b>${r.winner.score}点</b></div><div class="rankcard"><div>🥈 2着</div><div class="horseemoji"><img class="rank-art" src="${HORSE_ART[r.second.color]}" alt="${r.second.color}"></div><h2>${r.second.id}番 ${r.second.color}</h2><b>${r.second.score}点</b></div></div><p class="note">同点の場合は出走番号が小さい馬を上位に判定します。</p><button class="primary full bigbtn" onclick="advanceResult()">🎯 的中馬券を発表</button></section>`}else if(s===4){let r=game.result;o+=`<section class="panel center"><h2>🎯 馬券の当選発表</h2>${game.players.map((p,i)=>`<h3>${i?'🔴':'🔵'} ${playerLabel(i)}</h3>${p.tickets.length?p.tickets.map(t=>`<div class="ticket ${t.hit?'hit':'miss'}">${t.hit?'🎉 的中！':'✕ はずれ'}　${t.type==='win'?'単勝':'馬単'} ${t.first}番${t.type==='exact'?' → '+t.second+'番':''}<br><span class="small">${money(t.amount)} × ${t.odds.toFixed(2)} → 払戻 <strong>${money(t.payout)}</strong></span></div>`).join(''):'<p class="note">購入なし</p>'}`).join('')}<button class="primary full bigbtn" onclick="advanceResult()">💰 収支を見る</button></section>`}else if(s===5){let r=game.result;let cumulative=r.totals.map((x,i)=>x+game.history.reduce((acc,h)=>acc+h.payouts[i],0));o+=`<section class="panel center"><h2>💰 第${game.round}ラウンド結果</h2><div class="players">${game.players.map((p,i)=>`<div class="pl"><strong>${i?'🔴':'🔵'} ${playerLabel(i)}</strong><p class="small">購入総額 ${money(p.tickets.reduce((x,t)=>x+t.amount,0))}</p><p class="small">払戻総額 ${money(p.tickets.reduce((x,t)=>x+t.payout,0))}</p><div class="summary">${money(r.totals[i])}</div><p class="small">累計 ${money(cumulative[i])}</p></div>`).join('')}</div><p class="note">次のラウンドは両者とも新たに10,000円から開始します。</p><button class="primary full bigbtn" onclick="finishRound()">${game.round===2?'🏆 総合結果へ':'次のラウンドへ →'}</button></section>`}return o}
let countdownTimer=null;function startCountdown(){game.stage=1;render();if(game.settings.skip){revealNow();return}let sec=3;clearInterval(countdownTimer);countdownTimer=setInterval(()=>{if(game.screen!=='result'||game.stage!==1){clearInterval(countdownTimer);return}sec--;if(sec===0){clearInterval(countdownTimer);revealNow()}else{let el=document.getElementById('countText');if(el)el.textContent=sec}},850)}
function revealNow(){clearInterval(countdownTimer);if(game.screen!=='result')return;game.board.forEach(c=>c.revealed=true);calculateResult();game.stage=2;render()}
function advanceResult(){game.stage++;render()}
function finishRound(){let r=game.result;game.history.push({payouts:[...r.totals]});if(game.round===2){game.screen='final';render()}else{game.round++;game.first=1;initRound()}}
function returnHome(){stopRandomOpen();if(!['home','options','final'].includes(game.screen)&&!confirm('対戦を終了してタイトルに戻りますか？')){syncRandomOpen();return}clearInterval(countdownTimer);closeModal(false);game.screen='home';game.mode='view';render()}
function openRules(){stopRandomOpen();modalHost.innerHTML=`<div class="overlay"><div class="modal"><h2>📖 WAITING DERBYのルール</h2><div class="rulelist"><p>◆ <b>2人・2ラウンド</b>。各ラウンド10,000円から開始し、終了時残金の合計で勝負します。</p><p>◆ 馬6頭は初期公開。裏向きの効果カード10枚を公開します。Free Openは従来どおり、交互に選んで占います。Randm Openは手番開始後、5秒ごとにランダムな1枚が自動公開されます。</p><p>◆ 人参🥕は同じ行・列の上下左右にいるすべての馬へ+1（途中のカードで遮られません）、金人参🌟🥕は同じ範囲へ+2。体調❤️◎は隣接+1.5、💔×は隣接−1。体重⚖️は隣接する人参・体調カードを無効にします。</p><p>◆ 敗北予兆🔮は1枚で、指定された毛色の2頭を強制失格にします。残る4頭の得点が高い順で1着・2着を決め、同点時は出走番号が小さい順です。失格した馬には❌を表示します。</p><p>◆ Free Openの手番は「占う」か「馬券を買う→必ず1枚占う」。馬券は各ラウンド最大2枚で、賭け金は残金の範囲内で自由です（試作版は100円単位）。</p><p>◆ Randm Openでは手番プレイヤーが任意のタイミングで<b>Stop</b>。その時点の倍率で馬券を1枚購入すると交代します。購入取消・確認画面を閉じた後は5秒後から公開を再開します。購入・馬券確認・ルール表示・画面非表示中は公開を一時停止します。購入後の手動公開はありません。</p><p>◆ 両者が2枚購入または残金0円になれば早期終了。そうでなければ効果カード9枚（馬を含め15枚）公開後に最終購入へ進みます。最終購入では一人最大1枚です。</p><p>◆ 購入内容・残金は相手に秘密。確認フェイズでは双方の馬券を先に公開し、最後にカードを開いて結果を発表します。</p><p>◆ 裏向きカードの種類ごとの残り枚数を盤面下に表示します。敗北予兆の毛色など、未公開の詳細は秘密です。</p><p>◆ <b>倍率は試作値</b>。購入時点で確定し、払戻には元金を含みます。</p></div><button class="primary full" onclick="closeModal()">閉じる</button></div></div>`}
render();
</script></body></html>
